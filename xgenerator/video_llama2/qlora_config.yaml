seed: 42
save_path: null

model:
  version: "v1_mistral"
  vision_tower: "openai/clip-vit-large-patch14-336"
  model_name_or_path: "mistralai/Mistral-7B-Instruct-v0.2"
  mm_use_im_start_end: False
  mm_use_im_patch_token: False
  mm_projector_type: "stc_connector"
