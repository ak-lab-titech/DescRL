  logging_steps: 1
  model_max_length: 2048
  gradient_checkpointing: True
  dataloader_num_workers: 4
  report_to: tensorboard
  run_name: videollama2_vllava_qlora
  lora_enable: True
  lora_r: 128
  lora_alpha: 256
  mm_projector_lr: 0.00002
