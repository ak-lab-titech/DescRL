ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128

  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  USE_RENDERED_OBSERVATIONS: False
  CONTINUOUS_VIEW_CHANGE: True
  VIEW_CHANGE_FPS: 30
  AUDIO:
    RIR_SAMPLING_RATE: 44100
    SOURCE_SOUND_DIR: "data/sounds/demo"
    NUM: 2
  
  FORWARD_STEP_SIZE: 1.0
  STEP_TIME: 1.0
  TURN_ANGLE: 45

TASK:
  TYPE: AudioNav
  SUCCESS_DISTANCE: 2.0

  SENSORS: ['AUDIOGOAL_SENSOR']
  GOAL_SENSOR_UUID: audiogoal

  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'NORMALIZED_DISTANCE_TO_GOAL', 'SUCCESS', 'SPL', 'SOFT_SPL', 'NUM_SOFT_SUCCESS', 'NUM_SOFT_SPL']
  SUCCESS:
    SUCCESS_DISTANCE: 2.0
  NUM_SOFT_SUCCESS:
    SUCCESS_DISTANCE: 2.0
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 500
    DRAW_SOURCE_AND_TARGET: True
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: False
    


DATASET:
  TYPE: "AudioNav"
  SPLIT: "train_telephone"
  CONTENT_SCENES: ["*"]
  VERSION: 'v1'
  SCENES_DIR: "data/scene_datasets/replica"
  DATA_PATH: "data/datasets/audionav/replica/{version}/{split}/{split}.json.gz"
