ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  SEMANTIC_SENSOR:
    WIDTH: 128
    HEIGHT: 128

  STEP_TIME: 1
  
  DIRECT_MAP_SIZE: null # null means no SDM.
  DIRECT_MAP_DISTANCE: "geodesic"
  SHORTEST_PATH_DIRECTION: False
  USE_GT_DIRECT_MAP: False
  DROPOUT_RATE: 0.2
  NOISE_COEF: 0.0
  DM_USE_VISUAL: False
  DISTANCE_TRANS_METHOD: "1d"
  CLIPPING: True
  DM_USE_GRU: False
  DM_CGO: False
  USE_CONV1D: True

  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  SCENE_DATASET: "mp3d"
  GRID_SIZE: 1.0
  AUDIO:
    EVERLASTING: False # 音を永続的にするかどうか
    RIR_SAMPLING_RATE: 16000
    SOURCE_SOUND_DIR: "data/sounds/semantic_splits"
    NUM: 1
    HEARD_TEST: False # testで、heardで行うかunheardで行うか

TASK:
  TYPE: SemanticAudioNav
  SUCCESS_DISTANCE: 1.0

  SENSORS: ['AUDIOGOAL_SENSOR', 'SPECTROGRAM_SENSOR', 'CATEGORY', 'POINTGOAL_WITH_GPS_COMPASS_SENSOR', 'POSE_SENSOR', 'LOCATION_BELIEF', 'CATEGORY_BELIEF', 'GENERATED_INSTRUCTION']
  GOAL_SENSOR_UUID: spectrogram
  POINTGOAL_WITH_GPS_COMPASS_SENSOR:
    GOAL_FORMAT: "CARTESIAN"
    DIMENSIONALITY: 2
  GENERATED_INSTRUCTION:
    MODEL_TYPE: "cnn_tf" # "video_llama2"
    TOKENIZER_TYPE: "r2r" # "video_llama2"
    XGENERATOR_PATH: "../xgenerator/data/models/tf-speaker-semantic-24h"
    # XGENERATOR_PATH: "../xgenerator/data/models/cnntf_size336_48h"
    # XGENERATOR_PATH: "../xgenerator/data/models/video_llama2/finetune_videollama2_vllava_qlora_r128_a256_lr2en5"
    # XGENERATOR_PATH: "DAMO-NLP-SG/VideoLLaMA2-7B-Base" # num_frames must be 8.
    XGENERATOR_CKPT: 1000
    MAX_INSTRUCTION_LENGTH: 40
    FUTURE_STEP_NUM: 20 # -1なら最後まで。ただしpastでは-1は未実装
    MODEL_RESOLUTION: 128 # 336
    FUTURE_OR_PAST: "past" # future or past
    NUM_FRAMES: 16 # for video_llama2

  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'NORMALIZED_DISTANCE_TO_GOAL', 'SUCCESS', 'SPL', 'SOFT_SPL', 'NUM_ACTION', 'SUCCESS_WEIGHTED_BY_NUM_ACTION', 'SUCCESS_WHEN_SILENT']
  SUCCESS:
    SUCCESS_DISTANCE: 1.0
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 500
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: True
  DISTANCE_TO_GOAL:
    DISTANCE_TO: VIEW_POINTS

DATASET:
  TYPE: "SemanticAudioNav"
  SPLIT: "train" # train_w_instruction
  CONTENT_SCENES: ["*"]
  VERSION: 'v1'
  SCENES_DIR: "data/scene_datasets/mp3d"
  DATA_PATH: "data/datasets/semantic_audionav/mp3d/{version}/{split}/{split}.json.gz"
