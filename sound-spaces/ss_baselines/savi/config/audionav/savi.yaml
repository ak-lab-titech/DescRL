BASE_TASK_CONFIG_PATH: "configs/audionav/savi/replica/audiogoal.yaml"
TRAINER_NAME: "ddppo"
NUM_PROCESSES: 4
SENSORS: ["DEPTH_SENSOR", "RGB_SENSOR"]
NUM_UPDATES: 1251
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 5
VIDEO_OPTION: []
# VIDEO_OPTION: ["disk"] # video
VISUALIZATION_OPTION: []
TEST_EPISODE_COUNT: 200

EVAL:
  SPLIT: "test_telephone_0"
  USE_CKPT_CONFIG: True

RL:
  PPO:
    clip_param: 0.2
    ppo_epoch: 2
    num_mini_batch: 2
    value_loss_coef: 0.5
    entropy_coef: 0.05
    direct_map_loss_coef: 100
    lr: 2.5e-4
    eps: 1e-5
    max_grad_norm: 0.2
    # decide the length of history that ppo encodes
    num_steps: 150
    hidden_size: 512
    use_gae: True
    gamma: 0.99
    tau: 0.95
    use_linear_clip_decay: False
    use_linear_lr_decay: False
    # window size for calculating the past rewards
    reward_window_size: 50
    use_normalized_advantage: False
    policy_type: "smt"
    use_belief_predictor: True
    use_external_memory: True
    SCENE_MEMORY_TRANSFORMER:
      memory_size: 150
      hidden_size: 256
      nhead: 8
      num_encoder_layers: 1
      num_decoder_layers: 1
      dropout: 0.0
      activation: 'relu'
      use_pretrained: False
      pretrained_path: ''
      freeze_encoders: True
      pretraining: False
    BELIEF_PREDICTOR:
      online_training: True
      train_encoder: False
      lr: 1e-3
      use_label_belief: False
      use_location_belief: True
  DDPPO:
    sync_frac: 0.6
    distrib_backend: "GLOO"
    rnn_type: "GRU"
    num_recurrent_layers: 1
    backbone: "custom_resnet18"
    # choose the best pretrained SAVi based on validation curve
    pretrained_weights: "data/models/ss2/replica/model-savi-first/data/ckpt.XXX.pth"
    pretrained: True
    reset_critic: False