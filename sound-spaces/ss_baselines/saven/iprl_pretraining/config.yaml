BASE_TASK_CONFIG_PATH: "configs/semantic_audionav/savi/mp3d/semantic_audiogoal.yaml"
TRAINER_NAME: "ddppo"
NUM_PROCESSES: 1
SENSORS: ["DEPTH_SENSOR", "RGB_SENSOR", "SEMANTIC_SENSOR"]
NUM_UPDATES: 2000000
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 50
# VIDEO_OPTION: ["disk"] # video
VIDEO_OPTION: []


RL:
  PPO: # IPRLPretrainではPPO自体は用いていない
    lr: 2.5e-5 # 2.5e-4
    eps: 1e-5
    num_steps: 32 # 150
    num_mini_batch: 1 # 2
    max_grad_norm: 0.2
    use_belief_predictor: True
    use_external_memory: True
    SCENE_MEMORY_TRANSFORMER:
      memory_size: 64 # 150
      hidden_size: 256
      nhead: 8
      num_encoder_layers: 2 # 1
      num_decoder_layers: 1
      dropout: 0.0
      activation: 'relu'
      use_pretrained: False
      pretrained_path: ''
      use_xgen_visual_encoder: False
      freeze_encoders: True
      pretraining: False
    BELIEF_PREDICTOR:
      online_training: True # 学習はしないけど、belief_encoderのパラメータがTrueにしないと合わなくなるのでTrueにしている
      train_encoder: False
      lr: 1e-3
      use_label_belief: True
      use_location_belief: True
    INSTRUCTION_PREDICTOR:
      max_instr_len: 40
      num_decoder_layers: 3
      vocab_emb_size: 50
      emb_size: 256 # IPのembサイズ。SMTのemb_sizeと同じである必要がある
      nhead: 8
      dim_feedforward: 512
      dropout: 0.2
      iprl_use_gt_D: True
      feedback: "teacher" # teacher or student
      use_bos: False
  DDPPO:
    sync_frac: 0.6
    distrib_backend: "GLOO" # GLOO
    # choose the best pretrained SAVi based on validation curve
    pretrained_weights: "data/models/savi/data/ckpt.XXX.pth"
    pretrained: True
    reset_critic: False