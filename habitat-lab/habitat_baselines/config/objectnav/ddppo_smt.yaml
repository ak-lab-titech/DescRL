BASE_TASK_CONFIG_PATH: "habitat-lab/configs/tasks/objectnav_mp3d_smt.yaml"
CMD_TRAILING_OPTS: [
  "TASK_CONFIG.ENVIRONMENT.ITERATOR_OPTIONS.MAX_SCENE_REPEAT_STEPS", "50000",
]
ENV_NAME: "NavRLEnv"
TRAINER_NAME: "ddppo"
NUM_PROCESSES: 10
NUM_ENVIRONMENTS: 10
SENSORS: ["DEPTH_SENSOR", "RGB_SENSOR", "SEMANTIC_SENSOR"]
NUM_UPDATES: 20000
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 50
# VIDEO_OPTION: ["disk"] # video
VIDEO_OPTION: []
VISUALIZATION_OPTION: []

RL:
  SUCCESS_REWARD: 2.5
  SLACK_REWARD: -1e-3

  PPO:
    clip_param: 0.2
    ppo_epoch: 2
    num_mini_batch: 2
    iprl_loss_coef: 0.1
    value_loss_coef: 0.5
    direct_map_loss_coef: 100
    entropy_coef: 0.05
    lr: 2.5e-4
    eps: 1e-5
    max_grad_norm: 0.2
    # decide the length of history that ppo encodes
    num_steps: 150
    hidden_size: 512
    use_gae: True
    gamma: 0.99
    tau: 0.95
    use_linear_clip_decay: False
    use_linear_lr_decay: False
    # window size for calculating the past rewards
    reward_window_size: 50
    use_normalized_advantage: False
    policy_type: "smt"
    use_belief_predictor: False
    use_external_memory: True
    SCENE_MEMORY_TRANSFORMER:
      memory_size: 150
      hidden_size: 256
      nhead: 8
      num_encoder_layers: 2 # 1
      num_decoder_layers: 1
      dropout: 0.0
      activation: 'relu'
      use_pretrained: False
      pretrained_path: ''
      use_xgen_visual_encoder: True
      freeze_encoders: False
      pretraining: False
      use_belief_encoding: False
    BELIEF_PREDICTOR:
      online_training: False
      train_encoder: False
      lr: 0.001
      use_label_belief: False
      use_location_belief: False
      normalize_category_distribution: False
    INSTRUCTION_PREDICTOR:
      use_iprl: True # IPRLを行うかどうか
      max_instr_len: 40
      num_decoder_layers: 3
      vocab_emb_size: 50
      emb_size: 256 # IPのembサイズ。SMTのemb_sizeと同じである必要がある
      nhead: 8
      dim_feedforward: 512
      dropout: 0.2
      iprl_use_gt_D: False
      feedback: "teacher" # teacher or student
      use_bos: False
  DDPPO:
    sync_frac: 0.6
    distrib_backend: "NCCL" # "GLOO"
    rnn_type: "GRU"
    num_recurrent_layers: 1
    backbone: "custom_resnet18"
    # choose the best pretrained SAVi based on validation curve
    pretrained_weights: "data/models/savi/data/ckpt.XXX.pth"
    pretrained: False
    reset_critic: False
